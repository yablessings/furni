        let searchQuery = "";
        const searchInput = document.getElementById('search-input');
        const itemsContainer = document.getElementById('items-container');

        function renderItems() {
            const filteredItems = furnitureInventory.filter(item => 
                item.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            if (filteredItems.length === 0) {
                itemsContainer.innerHTML = `
                    <div class="p-8 text-center text-sm text-slate-400 font-medium">
                        Item not listed.
                    </div>
                `;
                return;
            }

            itemsContainer.innerHTML = filteredItems.map(item => {
                const isSelected = item.quantity > 0;
                let rowBg = "bg-white hover:bg-slate-50";
                let textStyle = "text-slate-700";
                
                if (item.status === "review") {
                    rowBg = "bg-amber-50/60 hover:bg-amber-50";
                    textStyle = "text-amber-900 font-medium";
                } else if (item.status === "dont-pickup") {
                    rowBg = "bg-red-50/40 opacity-70";
                    textStyle = "text-red-800 line-through";
                }

                // If locked, apply an extra distinct styling overlay
                if (item.isLocked) {
                    rowBg = "bg-emerald-50/40 border-l-4 border-emerald-500";
                }

                return `
                    <div class="flex items-center justify-between p-4 transition-all ${rowBg}">
                        <div class="flex items-center gap-2 pr-4">
                            <span class="text-sm ${textStyle}">${item.name}</span>
                        </div>
                        <div class="w-40 flex justify-end shrink-0 gap-2 items-center">
                            ${item.status === 'dont-pickup' ? `
                                <span class="text-xs font-semibold text-red-600 bg-red-100 px-2.5 py-1.5 rounded-lg select-none tracking-wide uppercase">
                                    Not Accepting
                                </span>
                            ` : item.status === 'review' && !isSelected && !item.isLocked ? `
                                <div class="flex flex-col items-end gap-1 w-full">
                                    <span class="text-[10px] font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded select-none tracking-wide uppercase mb-1">
                                        To Be Reviewed
                                    </span>
                                    <button 
                                        onclick="updateQty(${item.id}, 1)" 
                                        class="w-full py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-xs shadow-sm transition-colors tracking-wide h-9"
                                    >
                                        Add To Request
                                    </button>
                                </div>
                            ` : item.isLocked ? `
                                <div class="flex items-center gap-2">
                                    <span class="text-sm font-semibold text-emerald-700 bg-emerald-100/80 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                                        <span>Qty: ${item.quantity}</span>
                                        <span class="text-emerald-600">✓</span>
                                    </span>
                                    <button onclick="unlockItem(${item.id})" class="text-xs text-slate-400 hover:text-red-500 font-medium px-1 transition-colors">
                                        Edit
                                    </button>
                                </div>
                            ` : isSelected ? `
                                <div class="flex items-center bg-emerald-500 rounded-lg text-white shadow-sm overflow-hidden h-9">
                                    <button onclick="updateQty(${item.id}, -1)" class="px-2.5 h-full hover:bg-emerald-600 font-bold transition-colors select-none text-sm">-</button>
                                    <span class="w-8 text-center bg-white text-slate-800 font-semibold text-sm h-full flex items-center justify-center border-y border-emerald-500">${item.quantity}</span>
                                    <button onclick="updateQty(${item.id}, 1)" class="px-2.5 h-full hover:bg-emerald-600 font-bold transition-colors select-none text-sm">+</button>
                                </div>
                                <button 
                                    onclick="lockItem(${item.id})" 
                                    class="bg-emerald-600 hover:bg-emerald-700 text-white h-9 w-9 rounded-lg flex items-center justify-center shadow-sm font-bold transition-colors text-base"
                                    title="Lock in quantity"
                                >
                                    ✓
                                </button>
                            ` : `
                                <button 
                                    onclick="updateQty(${item.id}, 1)" 
                                    class="w-full py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-xs shadow-sm transition-colors tracking-wide h-9"
                                >
                                    Add To Request
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateQty(id, change) {
            const targetItem = furnitureInventory.find(item => item.id === id);
            if (targetItem && targetItem.status !== 'dont-pickup' && !targetItem.isLocked) {
                targetItem.quantity = Math.max(0, targetItem.quantity + change);
                renderItems();
            }
        }

        function lockItem(id) {
            const targetItem = furnitureInventory.find(item => item.id === id);
            if (targetItem && targetItem.quantity > 0) {
                targetItem.isLocked = true;
                renderItems();
                sendDataToJotform();
            }
        }

        function unlockItem(id) {
            const targetItem = furnitureInventory.find(item => item.id === id);
            if (targetItem) {
                targetItem.isLocked = false;
                renderItems();
                sendDataToJotform(); // Instantly clears or revises data pipeline dynamically
            }
        }
function sendDataToJotform() {
    const selectedItems = furnitureInventory.filter(
        item => item.quantity > 0 && item.isLocked
    );

    const formattedOutput = selectedItems
        .map(item => `${item.name} (Qty: ${item.quantity})`)
        .join(', ');

    // Send data to parent Jotform iframe
    parent.postMessage({
        type: "furniData",
        value: formattedOutput
    }, "*");
}

        // Initialize Jotform Widget Environment
        JotForm.subscribe("ready", function() {
            renderItems();
        });
